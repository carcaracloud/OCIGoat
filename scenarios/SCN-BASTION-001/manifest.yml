id: SCN-BASTION-001
name: Bastion Session Allowlist Open to Any Client IP
version: 1.0.0

category:
  - bastion
  - network-access-control

difficulty: medium

cloud:
  provider: oracle
  platform: oci

resources:
  - core_vcn
  - core_security_list
  - core_subnet
  - core_instance
  - bastion_bastion
  - identity_group
  - identity_user
  - identity_user_group_membership
  - identity_api_key
  - identity_policy

lifecycle:
  deploy: terraform
  destroy: terraform

requirements:
  terraform: ">=1.5.0"
  oci_provider: "9.2.0"
  player_credential: true
  flag: true

cost:
  always_free_preferred: true
  notes: >
    Oracle Cloud Infrastructure Bastion is listed as Free on the
    official price list. Uses 1 VM.Standard.E2.1.Micro instance,
    within the Always Free Compute allowance. Identity resources do
    not appear as billed line items on any Oracle pricing page checked
    for this project. Always run terraform destroy when done.
