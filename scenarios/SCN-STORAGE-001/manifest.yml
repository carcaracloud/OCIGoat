id: SCN-STORAGE-001
name: Public Bucket Listing Exposure
version: 1.0.0

category:
  - storage
  - object-storage
  - data-exposure

difficulty: easy

cloud:
  provider: oracle
  platform: oci

resources:
  - objectstorage_bucket
  - objectstorage_object

lifecycle:
  deploy: terraform
  destroy: terraform

requirements:
  terraform: ">=1.5.0"
  oci_provider: "9.2.0"

cost:
  always_free_preferred: true
  notes: >
    Object Storage Always Free includes up to 20 GB combined across
    tiers and 50,000 API requests per month. The fixture object in this
    scenario is a few dozen bytes. Always run terraform destroy when
    done.
